apiVersion: v1
kind: Pod
metadata:
  name: ld-preload
spec:
  hostUsers: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: debian:bookworm-slim
    securityContext:
      allowPrivilegeEscalation: false
      runAsUser: 10001
      capabilities:
        drop:
        - ALL
    env:
    - name: LD_PRELOAD
      value: /tmp/x.so
