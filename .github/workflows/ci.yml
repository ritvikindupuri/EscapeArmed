name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: pytest -q
      - name: Self scan of test fixtures (SARIF)
        run: escapearmed scan compose tests/fixtures/compose.vulnerable.yml -f sarif -o escapearmed.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: escapearmed-sarif
          path: escapearmed.sarif
