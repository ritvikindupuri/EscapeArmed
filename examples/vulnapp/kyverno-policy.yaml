# Generated by EscapeArmed. Kyverno ValidatingPolicy (policies.kyverno.io/v1, CEL),
# for Kyverno 1.17 and later.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: escapearmed-block-escape-primitives
  annotations:
    policies.kyverno.io/title: Block container escape primitives (EscapeArmed)
    policies.kyverno.io/category: Container Escape
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Generated by EscapeArmed from scan findings. Blocks the configuration primitives
      used for container escape, including the setups that make CVE-2025-31133, CVE-2025-52565, CVE-2025-52881 and
      CVE-2025-23266 exploitable.
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: variables.allContainers.all(c, !c.?securityContext.?privileged.orValue(false))
    message: 'EscapeArmed EA001: privileged containers are not allowed.'
  - expression: object.spec.?volumes.orValue([]).all(v, !(v.?hostPath.?path.orValue('') in ['/var/run/docker.sock',
      '/run/docker.sock', '/run/containerd/containerd.sock', '/var/run/containerd/containerd.sock', '/run/crio/crio.sock',
      '/var/run/crio/crio.sock', '/run/podman/podman.sock', '/var/run/cri-dockerd.sock', '/run/k3s/containerd/containerd.sock']))
    message: 'EscapeArmed EA003: mounting a container runtime socket is not allowed.'
  - expression: object.spec.?volumes.orValue([]).all(v, v.?hostPath.?path.orValue('') != '/' && !['/proc', '/sys',
      '/etc', '/dev', '/root', '/boot', '/lib/modules', '/usr/lib/modules', '/var/lib/docker', '/var/lib/containerd',
      '/var/lib/kubelet', '/var/run', '/run'].exists(p, v.?hostPath.?path.orValue('') == p || v.?hostPath.?path.orValue('').startsWith(p
      + '/')))
    message: 'EscapeArmed EA004/EA005: hostPath mounts of the host root or sensitive host directories are not allowed.'
  - expression: '!object.spec.?hostPID.orValue(false) && !object.spec.?hostIPC.orValue(false) && !object.spec.?hostNetwork.orValue(false)'
    message: 'EscapeArmed EA006/EA007/EA008: hostPID, hostIPC and hostNetwork are not allowed.'
  - expression: variables.allContainers.all(c, !c.?securityContext.?capabilities.?add.orValue([]).exists(cap, cap
      in ['ALL', 'SYS_ADMIN', 'SYS_MODULE', 'DAC_READ_SEARCH', 'SYS_PTRACE', 'SYS_RAWIO', 'BPF', 'SYS_BOOT', 'PERFMON',
      'NET_ADMIN', 'CAP_SYS_ADMIN', 'CAP_SYS_MODULE', 'CAP_DAC_READ_SEARCH', 'CAP_SYS_PTRACE', 'CAP_SYS_RAWIO',
      'CAP_BPF', 'CAP_SYS_BOOT', 'CAP_PERFMON', 'CAP_NET_ADMIN']))
    message: 'EscapeArmed EA002: capabilities that enable container escape (SYS_ADMIN, SYS_MODULE, DAC_READ_SEARCH,
      SYS_PTRACE, ...) are not allowed.'
  - expression: object.spec.?securityContext.?appArmorProfile.?type.orValue('') != 'Unconfined' && variables.allContainers.all(c,
      c.?securityContext.?appArmorProfile.?type.orValue('') != 'Unconfined') && !object.metadata.?annotations.orValue({}).exists(k,
      k.startsWith('container.apparmor.security.beta.kubernetes.io/') && object.metadata.annotations[k] == 'unconfined')
    message: 'EscapeArmed EA009: AppArmor must not be Unconfined.'
  - expression: object.spec.?securityContext.?seccompProfile.?type.orValue('') != 'Unconfined' && variables.allContainers.all(c,
      c.?securityContext.?seccompProfile.?type.orValue('') != 'Unconfined')
    message: 'EscapeArmed EA010: seccomp must not be Unconfined.'
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: escapearmed-block-escape-primitives-audit
  annotations:
    policies.kyverno.io/title: Audit root and missing user namespaces (EscapeArmed)
    policies.kyverno.io/category: Container Escape
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: Generated by EscapeArmed from scan findings. Blocks the configuration primitives
      used for container escape, including the setups that make CVE-2025-31133, CVE-2025-52565, CVE-2025-52881 and
      CVE-2025-23266 exploitable.
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: allContainers
    expression: object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: object.spec.?securityContext.?runAsNonRoot.orValue(false) || variables.allContainers.all(c, c.?securityContext.?runAsNonRoot.orValue(false))
    message: 'EscapeArmed EA013: containers should set runAsNonRoot: true.'
  - expression: object.spec.?hostUsers.orValue(true) == false
    message: 'EscapeArmed EA013: run pods in a user namespace (hostUsers: false). This neutralizes CVE-2025-31133,
      CVE-2025-52565 and CVE-2025-52881.'
