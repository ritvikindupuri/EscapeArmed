# Generated by EscapeArmed. Load with: falco -r escapearmed_falco_rules.yaml
- required_engine_version: 0.31.0
- macro: ea_container
  condition: (container.id != host and container.id != "")
- macro: ea_open_write
  condition: (evt.type in (open, openat, openat2) and evt.is_open_write=true and fd.num>=0)
- macro: ea_open_read
  condition: (evt.type in (open, openat, openat2) and evt.is_open_read=true and fd.num>=0)
- macro: ea_spawned_process
  condition: (evt.type in (execve, execveat))
- rule: EscapeArmed Container Writes Host Kernel Hook
  desc: A container process opened core_pattern, modprobe or binfmt_misc for writing. This is the end goal of CVE-2025-31133
    style escapes and classic privileged escapes.
  condition: ea_open_write and ea_container and (fd.name in (/proc/sys/kernel/core_pattern, /proc/sys/kernel/modprobe,
    /proc/sys/fs/binfmt_misc/register) or fd.name startswith /proc/sys/kernel/core_pattern)
  output: Container wrote a host kernel hook (file=%fd.name container=%container.name image=%container.image.repository
    proc=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags:
  - escapearmed
  - container_escape
  - mitre_privilege_escalation
  - T1611
  - CVE-2025-31133
- rule: EscapeArmed Container Writes sysrq-trigger
  desc: A container opened /proc/sysrq-trigger for writing. CVE-2025-52881 shows runc writes can be redirected here.
  condition: ea_open_write and ea_container and fd.name = /proc/sysrq-trigger
  output: Container opened sysrq-trigger for write (container=%container.name image=%container.image.repository
    proc=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags:
  - escapearmed
  - container_escape
  - T1611
  - CVE-2025-52881
- rule: EscapeArmed Cgroup Release Agent Write
  desc: A container wrote a cgroup v1 release_agent or notify_on_release file.
  condition: ea_open_write and ea_container and (fd.name endswith /release_agent or fd.name endswith /notify_on_release)
  output: cgroup release_agent escape attempt (file=%fd.name container=%container.name image=%container.image.repository
    proc=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags:
  - escapearmed
  - container_escape
  - T1611
- rule: EscapeArmed Mount From Container
  desc: A process inside a container called mount. Normal workloads do not mount filesystems.
  condition: evt.type in (mount, fsmount, move_mount) and ea_container
  output: mount syscall inside container (container=%container.name image=%container.image.repository proc=%proc.cmdline
    user=%user.name)
  priority: WARNING
  tags:
  - escapearmed
  - container_escape
  - T1611
- rule: EscapeArmed Container Runtime Socket Connect
  desc: A container connected to the Docker, containerd or CRI-O socket.
  condition: evt.type = connect and ea_container and fd.typechar = u and (fd.name contains docker.sock or fd.name
    contains containerd.sock or fd.name contains crio.sock or fd.name contains podman.sock)
  output: Container connected to runtime socket (socket=%fd.name container=%container.name image=%container.image.repository
    proc=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags:
  - escapearmed
  - container_escape
  - T1610
  - T1611
- rule: EscapeArmed Host Root Via proc PID 1
  desc: A container read through /proc/1/root or ran nsenter, the host PID namespace escape path.
  condition: ea_container and ((ea_open_read and fd.name startswith /proc/1/root/) or (ea_spawned_process and proc.name
    = nsenter))
  output: Host filesystem reached through /proc/1 (file=%fd.name container=%container.name image=%container.image.repository
    proc=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags:
  - escapearmed
  - container_escape
  - T1611
- rule: EscapeArmed Write Through Host Mount
  desc: A container wrote into a host bind mount that EscapeArmed flagged as sensitive.
  condition: ea_open_write and ea_container and (fd.name startswith /host/ or fd.name startswith /shared/)
  output: Write into sensitive host mount (file=%fd.name container=%container.name image=%container.image.repository
    proc=%proc.cmdline user=%user.name)
  priority: ERROR
  tags:
  - escapearmed
  - container_escape
  - T1611
- rule: EscapeArmed Kernel Module Load From Container
  desc: A container called init_module or finit_module.
  condition: evt.type in (init_module, finit_module) and ea_container
  output: Kernel module load from container (container=%container.name image=%container.image.repository proc=%proc.cmdline
    user=%user.name)
  priority: CRITICAL
  tags:
  - escapearmed
  - container_escape
  - T1611
  - T1547.006
