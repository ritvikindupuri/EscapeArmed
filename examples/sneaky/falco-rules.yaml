# Generated by EscapeArmed. Load with: falco -r escapearmed_falco_rules.yaml
- required_engine_version: 0.31.0
- macro: ea_container
  condition: (container.id != host and container.id != "")
- macro: ea_open_write
  condition: (evt.type in (open, openat, openat2) and evt.is_open_write=true and fd.num>=0)
- macro: ea_open_read
  condition: (evt.type in (open, openat, openat2) and evt.is_open_read=true and fd.num>=0)
- macro: ea_spawned_process
  condition: (evt.type in (execve, execveat))
- rule: EscapeArmed Cgroup Release Agent Write
  desc: A container wrote a cgroup v1 release_agent or notify_on_release file.
  condition: ea_open_write and ea_container and (fd.name endswith /release_agent or fd.name endswith /notify_on_release)
  output: cgroup release_agent escape attempt (file=%fd.name container=%container.name image=%container.image.repository
    proc=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags:
  - escapearmed
  - container_escape
  - T1611
- rule: EscapeArmed Mount From Container
  desc: A process inside a container called mount. Normal workloads do not mount filesystems.
  condition: evt.type in (mount, fsmount, move_mount) and ea_container
  output: mount syscall inside container (container=%container.name image=%container.image.repository proc=%proc.cmdline
    user=%user.name)
  priority: WARNING
  tags:
  - escapearmed
  - container_escape
  - T1611
- rule: EscapeArmed Kernel Module Load From Container
  desc: A container called init_module or finit_module.
  condition: evt.type in (init_module, finit_module) and ea_container
  output: Kernel module load from container (container=%container.name image=%container.image.repository proc=%proc.cmdline
    user=%user.name)
  priority: CRITICAL
  tags:
  - escapearmed
  - container_escape
  - T1611
  - T1547.006
