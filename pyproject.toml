[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "escapearmed"
version = "0.1.0"
description = "Container escape readiness scanner and prover with Kyverno, Falco and SARIF output"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ritvik Indupuri"}]
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Environment :: Console",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
escapearmed = "escapearmed.cli:main"

[project.urls]
Homepage = "https://github.com/ritvikindupuri/EscapeArmed"

[tool.setuptools]
packages = ["escapearmed", "escapearmed.sources", "escapearmed.generators"]

[tool.setuptools.package-data]
escapearmed = ["probe.sh"]
